name: mizan

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mizan-api:latest
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${MIZAN_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      # دادهٔ SQLite روی volume پایدار می‌ماند؛ مقدار .env برای مسیر محلی override می‌شود.
      MIZAN_DATABASE_PATH: /data/mizan.db
    volumes:
      - mizan-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  regulatory-sync:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mizan-api:latest
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ./backend/.env
    environment:
      MIZAN_DATABASE_PATH: /data/mizan.db
    volumes:
      - mizan-data:/data
    command: ["python", "-m", "app.regulatory_sync"]
    restart: "no"

volumes:
  mizan-data:
