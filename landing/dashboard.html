<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>میزان | داشبورد مدیریت</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-page"><main class="container admin-shell"><header class="admin-header"><a class="brand" href="index.html"><span class="brand-mark">م</span>میزان</a><span>داشبورد مدیریتی ریسک</span></header><section id="login" class="admin-login"><h1>ورود به داشبورد</h1><p>توکن دسترسی سازمان را وارد کنید. این مقدار در مرورگر ذخیره نمی‌شود.</p><form id="token-form"><label>توکن دسترسی<input id="token" type="password" required autocomplete="off"></label><button class="button button-primary">نمایش داشبورد</button></form><p id="login-status" role="status"></p></section><section id="dashboard" hidden><div class="dashboard-heading"><div><div class="eyebrow">نمای امروز</div><h1>تصویر ریسک سازمان</h1></div><button id="logout" class="button button-outline">خروج</button></div><div class="metric-grid"><article><span>تصمیم‌های ثبت‌شده</span><strong id="decision-count">—</strong></article><article><span>موارد بحرانی</span><strong id="critical-count">—</strong></article><article><span>هشدارهای خوانده‌نشده</span><strong id="alert-count">—</strong></article></div><div class="dashboard-grid"><article class="admin-card"><h2>توزیع سطح ریسک</h2><div id="risk-distribution"></div></article><article class="admin-card"><h2>تصمیم‌های اخیر</h2><div id="recent-decisions"></div></article></div></section></main><script src="dashboard.js"></script></body></html>
